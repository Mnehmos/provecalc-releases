name: Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full 40-character commit from the private app master branch'
        type: string
        required: true
      source_tag:
        description: 'Matching numeric release tag, for example v0.1.10-1'
        type: string
        required: true
      source_capsule_sha256:
        description: 'SHA-256 of the encrypted source capsule staged in the draft'
        type: string
        required: true

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_TAG: ${{ inputs.source_tag }}
  SOURCE_CAPSULE_SHA256: ${{ inputs.source_capsule_sha256 }}

permissions:
  contents: read

concurrency:
  group: provecalc-release-${{ inputs.source_tag }}
  cancel-in-progress: true

jobs:
  source-identity:
    if: github.ref == 'refs/heads/main'
    environment: release
    # Draft releases are invisible to read-only tokens; this job only downloads the capsule.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate source inputs
        run: |
          python3 - <<'PY'
          import os, re
          for name, pattern in [('SOURCE_SHA', r'[0-9a-f]{40}'), ('SOURCE_CAPSULE_SHA256', r'[0-9a-f]{64}'), ('SOURCE_TAG', r'v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:0|[1-9]\d*))?')]:
              if not re.fullmatch(pattern, os.environ[name]):
                  raise SystemExit('Invalid immutable source input.')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the encrypted reviewed source capsule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_KEY: ${{ secrets.SOURCE_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-capsule"
          gh release download "$SOURCE_TAG" --repo Mnehmos/provecalc-releases --pattern Source.enc --dir "$RUNNER_TEMP/source-capsule"
          python scripts/decrypt_release_source.py --capsule "$RUNNER_TEMP/source-capsule/Source.enc" --sha256 "$SOURCE_CAPSULE_SHA256" --source-sha "$SOURCE_SHA"

  release-checks:
    environment: release
    # Draft releases are invisible to read-only tokens; this job only downloads the capsule.
    permissions:
      contents: write
    name: Release Consistency
    needs: [source-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the encrypted reviewed source capsule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_KEY: ${{ secrets.SOURCE_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-capsule"
          gh release download "$SOURCE_TAG" --repo Mnehmos/provecalc-releases --pattern Source.enc --dir "$RUNNER_TEMP/source-capsule"
          python scripts/decrypt_release_source.py --capsule "$RUNNER_TEMP/source-capsule/Source.enc" --sha256 "$SOURCE_CAPSULE_SHA256" --source-sha "$SOURCE_SHA"

      - name: Check versions, Tauri packages, updater signing, and notes
        run: python3 scripts/check_release_consistency.py --tag "${{ inputs.source_tag }}"

      - name: Check release tooling and native command registration
        run: python3 -m unittest discover -s scripts/tests

  frontend-tests:
    environment: release
    # Draft releases are invisible to read-only tokens; this job only downloads the capsule.
    permissions:
      contents: write
    name: Frontend Tests
    needs: [source-identity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the encrypted reviewed source capsule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_KEY: ${{ secrets.SOURCE_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-capsule"
          gh release download "$SOURCE_TAG" --repo Mnehmos/provecalc-releases --pattern Source.enc --dir "$RUNNER_TEMP/source-capsule"
          python scripts/decrypt_release_source.py --capsule "$RUNNER_TEMP/source-capsule/Source.enc" --sha256 "$SOURCE_CAPSULE_SHA256" --source-sha "$SOURCE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Test observability MCP pairing
        run: npm run test:mcp

  rust-tests:
    environment: release
    # Draft releases are invisible to read-only tokens; this job only downloads the capsule.
    permissions:
      contents: write
    name: Rust Tests
    needs: [source-identity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the encrypted reviewed source capsule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_KEY: ${{ secrets.SOURCE_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-capsule"
          gh release download "$SOURCE_TAG" --repo Mnehmos/provecalc-releases --pattern Source.enc --dir "$RUNNER_TEMP/source-capsule"
          python scripts/decrypt_release_source.py --capsule "$RUNNER_TEMP/source-capsule/Source.enc" --sha256 "$SOURCE_CAPSULE_SHA256" --source-sha "$SOURCE_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@9423510f11512992cb6c790b35e139796f7ac612 # 1.90.0
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xauth dbus-x11

      - name: Stub sidecar binary for build.rs externalBin path check
        # Tauri validates externalBin paths at compile time. The real
        # bundle is built in the build matrix below; a stub suffices
        # for library-only tests.
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/provecalc-sidecar-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/provecalc-sidecar-x86_64-unknown-linux-gnu

      - name: Stub frontend distribution for Tauri compile-time check
        run: |
          mkdir -p dist
          touch dist/index.html

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Run Clippy with warnings denied
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        # Unit, disk round-trip, and documentation tests.
        working-directory: src-tauri
        run: cargo test

      - name: Install locked cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        # Known vulnerabilities are release-blocking; the nightly audit can
        # go red between releases without anyone looking at it.
        working-directory: src-tauri
        run: cargo audit

  python-tests:
    environment: release
    # Draft releases are invisible to read-only tokens; this job only downloads the capsule.
    permissions:
      contents: write
    name: Python Tests
    needs: [source-identity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the encrypted reviewed source capsule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_KEY: ${{ secrets.SOURCE_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-capsule"
          gh release download "$SOURCE_TAG" --repo Mnehmos/provecalc-releases --pattern Source.enc --dir "$RUNNER_TEMP/source-capsule"
          python scripts/decrypt_release_source.py --capsule "$RUNNER_TEMP/source-capsule/Source.enc" --sha256 "$SOURCE_CAPSULE_SHA256" --source-sha "$SOURCE_SHA"

      - name: Setup uv and supported Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
          python-version: '3.12.13'
          activate-environment: true
          no-project: true
          enable-cache: true
          cache-python: true

      - name: Install dependencies
        run: uv pip install --require-hashes -r sidecar/requirements-dev.txt

      - name: Check dependency consistency
        run: uv pip check

      - name: Run Ruff
        working-directory: sidecar
        run: python -m ruff check .

      - name: Run Mypy
        working-directory: sidecar
        run: python -m mypy

      - name: Run Python tests
        working-directory: sidecar
        run: python -m pytest tests/ -v --tb=short

  create-release:
    name: Create Draft Release
    needs: [release-checks, frontend-tests, rust-tests, python-tests]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Require the capsule's existing unpublished draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$SOURCE_TAG" --repo Mnehmos/provecalc-releases --json isDraft --jq .isDraft)" = true
          RELEASE_ID=$(gh release view "$SOURCE_TAG" --repo Mnehmos/provecalc-releases --json databaseId --jq .databaseId)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    permissions:
      contents: write
    needs: [create-release]
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            arch: x86_64
            rust-target: x86_64-pc-windows-msvc
            updater-platform: windows-x86_64
            bundle-dir: src-tauri/target/release/bundle
          - platform: macos-15
            args: '--target aarch64-apple-darwin'
            arch: aarch64
            rust-target: aarch64-apple-darwin
            updater-platform: darwin-aarch64
            bundle-dir: src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin'
            arch: x86_64
            rust-target: x86_64-apple-darwin
            updater-platform: darwin-x86_64
            bundle-dir: src-tauri/target/x86_64-apple-darwin/release/bundle
          - platform: ubuntu-22.04
            args: ''
            arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
            updater-platform: linux-x86_64
            bundle-dir: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the encrypted reviewed source capsule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_KEY: ${{ secrets.SOURCE_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-capsule"
          gh release download "$SOURCE_TAG" --repo Mnehmos/provecalc-releases --pattern Source.enc --dir "$RUNNER_TEMP/source-capsule"
          python scripts/decrypt_release_source.py --capsule "$RUNNER_TEMP/source-capsule/Source.enc" --sha256 "$SOURCE_CAPSULE_SHA256" --source-sha "$SOURCE_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@9423510f11512992cb6c790b35e139796f7ac612 # 1.90.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xauth dbus-x11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup uv and supported Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
          python-version: '3.12.13'
          activate-environment: true
          no-project: true
          enable-cache: true
          cache-python: true

      - name: Install sidecar dependencies
        run: uv pip install --require-hashes -r sidecar/requirements-build.txt

      - name: Check sidecar dependency consistency
        run: uv pip check

      - name: Verify Python host architecture matches the bundled engine target
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PY'
          import os, platform
          actual = platform.machine().lower()
          actual = {'amd64': 'x86_64', 'arm64': 'aarch64'}.get(actual, actual)
          if actual != os.environ['EXPECTED_ARCH']:
              raise SystemExit('The Python engine host does not match the installer architecture.')
          PY

      - name: Build bundled sidecar binary (PyInstaller)
        shell: bash
        working-directory: sidecar
        run: |
          python -m PyInstaller provecalc-sidecar.spec --distpath ../src-tauri/binaries --clean -y

      - name: Rename sidecar binary to Rust target triple
        shell: bash
        run: |
          set -e
          BIN_DIR="src-tauri/binaries"
          TRIPLE="${{ matrix.rust-target }}"
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            mv "$BIN_DIR/provecalc-sidecar.exe" "$BIN_DIR/provecalc-sidecar-${TRIPLE}.exe"
          else
            mv "$BIN_DIR/provecalc-sidecar" "$BIN_DIR/provecalc-sidecar-${TRIPLE}"
            chmod +x "$BIN_DIR/provecalc-sidecar-${TRIPLE}"
          fi
          ls -la "$BIN_DIR"

      - name: Smoke-test the actual frozen engine before bundling
        shell: bash
        env:
          ENGINE_TARGET: ${{ matrix.rust-target }}
          ENGINE_OS: ${{ matrix.platform }}
        run: |
          suffix=''
          if [[ "$ENGINE_OS" == windows-* ]]; then suffix='.exe'; fi
          python scripts/smoke_frozen_sidecar.py --binary "src-tauri/binaries/provecalc-sidecar-${ENGINE_TARGET}${suffix}"

      - name: Build unsigned installers into the draft
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
          BUNDLE_DIR: ${{ matrix.bundle-dir }}
          BUILD_PLATFORM: ${{ matrix.updater-platform }}
        run: |
          set -euo pipefail
          npx tauri build $BUILD_ARGS --config '{"bundle":{"createUpdaterArtifacts":false}}'
          if [[ "$BUILD_PLATFORM" == darwin-* ]]; then
            tar -czf "$BUNDLE_DIR/macos/ProveCalc.app.tar.gz" -C "$BUNDLE_DIR/macos" ProveCalc.app
          fi

      - name: Smoke-test the packaged Linux application and engine cleanup
        if: matrix.updater-platform == 'linux-x86_64'
        run: xvfb-run -a dbus-run-session python scripts/smoke_packaged_app.py --app src-tauri/target/release/provecalc

      - name: Stage and upload unsigned draft artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_DIR: ${{ matrix.bundle-dir }}
          BUILD_PLATFORM: ${{ matrix.updater-platform }}
        run: |
          set -euo pipefail
          python scripts/stage_unsigned_release.py --platform "$BUILD_PLATFORM" --bundle "$BUNDLE_DIR" --out unsigned-assets
          gh release upload "$SOURCE_TAG" unsigned-assets/* --repo Mnehmos/provecalc-releases --clobber

  publish-metadata:
    permissions:
      contents: write
    name: Publish SBOM and Provenance
    needs: [build]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the encrypted reviewed source capsule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_KEY: ${{ secrets.SOURCE_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-capsule"
          gh release download "$SOURCE_TAG" --repo Mnehmos/provecalc-releases --pattern Source.enc --dir "$RUNNER_TEMP/source-capsule"
          python scripts/decrypt_release_source.py --capsule "$RUNNER_TEMP/source-capsule/Source.enc" --sha256 "$SOURCE_CAPSULE_SHA256" --source-sha "$SOURCE_SHA"

      - name: Generate release-revision SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release-sbom.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM and download published artifacts
        shell: bash
        env:
          PUBLIC_RELEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.source_tag }}"
          VERSION="${TAG#v}"
          mkdir -p release-assets

          GH_TOKEN="$PUBLIC_RELEASE_TOKEN" gh release download "$TAG" \
            --repo Mnehmos/provecalc-releases \
            --pattern 'ProveCalc*' \
            --dir release-assets

          # A rerun may download metadata from an earlier attempt. Remove only
          # those generated files before hashing the published app artifacts.
          find release-assets -maxdepth 1 -type f \
            \( -name 'ProveCalc_*_SHA256SUMS.txt' \
               -o -name 'ProveCalc_*_provenance.intoto.json' \
               -o -name 'ProveCalc_*_build.json' \
               -o -name '*.sig' \
               -o -name 'ProveCalc_*_sbom.spdx.json' \) \
            -delete

          SBOM_PATH="release-assets/ProveCalc_${VERSION}_sbom.spdx.json"
          python scripts/validate_spdx_sbom.py \
            --path release-sbom.spdx.json \
            --expected-syft-version 1.42.3
          mv release-sbom.spdx.json "$SBOM_PATH"

      - name: Bind all unsigned binaries to this build invocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/stage_unsigned_release.py --record release-assets --out "ProveCalc_${SOURCE_TAG#v}_build.json"
          gh release upload "$SOURCE_TAG" "release-assets/ProveCalc_${SOURCE_TAG#v}_sbom.spdx.json" "ProveCalc_${SOURCE_TAG#v}_build.json" --repo Mnehmos/provecalc-releases --clobber
          echo "Unsigned draft is complete. Signing and publication require the private local release workflow."
